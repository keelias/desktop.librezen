# Default JIT behavior. Per-site overrides are stored as "jit" permissions.
- name: librezen.jit.enabled-by-default
  value: true

# LibreZen does not yet publish signed MAR packages or Gecko update manifests.
# Keep the built-in updater disabled until a verified LibreZen update feed exists.
# The URL below reserves the intended GitHub Releases asset naming convention;
# it is not live until each release includes the matching XML and MAR files.
- name: app.update.enabled
  value: false
- name: app.update.url
  value: "https://github.com/keelias/desktop.librezen/releases/latest/download/update-%BUILD_TARGET%-%LOCALE%.xml"
- name: app.update.url.manual
  value: "https://github.com/keelias/desktop.librezen/releases"
- name: app.update.url.details
  value: "https://github.com/keelias/desktop.librezen/releases"
- name: app.releaseNotesURL.prompt
  value: "https://github.com/keelias/desktop.librezen/releases"
