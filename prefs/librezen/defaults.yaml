# Default JIT behavior. Per-site overrides are stored as "jit" permissions.
- name: librezen.jit.enabled-by-default
  value: true

# LibreZen does not yet have a configured update service or release feed.
# Disable Gecko updates and leave every update endpoint unconfigured until
# signed MAR packages, XML manifests, and release automation are ready.
- name: app.update.enabled
  value: false
- name: app.update.url
  value: ""
- name: app.update.url.manual
  value: ""
- name: app.update.url.details
  value: ""
- name: app.releaseNotesURL.prompt
  value: ""
